# The single required merge gate for flexLingua sentence translation (epic #341).
# Runs the canonical A1 sentence test matrix from tests/ — the exact same runner
# as local `npm test` (tests/run.mjs). No other test paths are wired.
name: translation-matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  translation-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.12
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the canonical sentence translation matrix
        run: npm test
      - name: Upload matrix reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: translation-matrix-reports
          path: tests/.reports/
          if-no-files-found: warn
