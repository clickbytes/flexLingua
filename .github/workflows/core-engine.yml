name: Core Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Node unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      node-version: ${{ steps.runtime.outputs.node-version }}
      npm-version: ${{ steps.runtime.outputs.npm-version }}
      test-summary: ${{ steps.node-tests.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Runtime details
        id: runtime
        run: |
          echo "node-version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm-version=$(npm --version)" >> "$GITHUB_OUTPUT"
      - name: Full Node test suite
        id: node-tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/node-tests.log"
          test_status=${PIPESTATUS[0]}
          node tools/check-core-gates.mjs --test-summary "$RUNNER_TEMP/node-tests.log" >> "$GITHUB_OUTPUT"
          summary_status=$?
          if [ "$test_status" -eq 0 ] && [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"

  lexical-audits:
    name: Lexicon morphology gold and A1 checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      node-version: ${{ steps.runtime.outputs.node-version }}
      npm-version: ${{ steps.runtime.outputs.npm-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Runtime details
        id: runtime
        run: |
          echo "node-version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm-version=$(npm --version)" >> "$GITHUB_OUTPUT"
      - run: npm run check:lexicon
      - run: npm run check:morphology
      - run: npm run check:gold
      - run: npm run check:a1-gold
      - run: npm run check:gold-family
      - run: npm run check:gold-father
      - run: npm run check:gold-movement
      - run: npm run check:gold-actions
      - run: npm run check:gold-person
      - run: npm run check:a1-evidence
      - run: npm run check:coverage
      - run: npm run check:data-provenance

  dialogue-gold:
    name: Bilingual dialogue scenario gold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run check:dialogue-gold

  release-gate:
    name: Aggregate release gate
    if: ${{ always() }}
    needs: [engine-tests, lexical-audits, dialogue-gold]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate deterministic release evidence and enforce both gates
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_UNIT_TEST_RESULT: ${{ needs.engine-tests.result }}
          RELEASE_AUDIT_RESULT: ${{ needs.lexical-audits.result }}
          RELEASE_DIALOGUE_RESULT: ${{ needs.dialogue-gold.result }}
          RELEASE_UNIT_TEST_SUMMARY: ${{ needs.engine-tests.outputs.test-summary }}
          RELEASE_UNIT_TEST_NODE: ${{ needs.engine-tests.outputs.node-version }}
          RELEASE_UNIT_TEST_NPM: ${{ needs.engine-tests.outputs.npm-version }}
          RELEASE_AUDIT_NODE: ${{ needs.lexical-audits.outputs.node-version }}
          RELEASE_AUDIT_NPM: ${{ needs.lexical-audits.outputs.npm-version }}
        run: node tools/check-core-gates.mjs --ci
