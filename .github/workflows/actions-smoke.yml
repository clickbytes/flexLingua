name: Actions Startup Probe
# G1b second push: the workflow existed on default branch before this change.
# Minimal, manually reusable G1b diagnostic. Not a replacement for Core Engine CI.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actions-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-start:
    name: Verify runner allocation only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner starts
        run: echo "G1b probe reached a GitHub-hosted runner"
