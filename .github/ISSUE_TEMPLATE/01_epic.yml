name: "EPIC — zakres rozwoju"
description: "Cel, zależności, mierzalne kryteria odbioru i lista zadań."
title: "[EPIC][P1][CORE] "
body:
  - type: markdown
    attributes:
      value: |
        Epik jest jednostką planowania, nie jedną zmianą w kodzie.
        Linkuj powiązane zadania jako listę - [ ] #numer. Wyniki i zależności zapisuj w powiązanych issue.
  - type: input
    id: code
    attributes:
      label: "Kod epiku"
      description: "Np. PERS, VAL, DIAL (unikalny wśród kodów epików w GitHub Issues)."
      placeholder: "PERS"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options:
        - "P0 — blocker"
        - "P1 — następna iteracja"
        - "P2 — po MVP"
        - "P3 — dalsza roadmapa"
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Właściciel obszaru
      options:
        - CORE
        - Data / PL / EN
        - Quality / Platform
        - GUI / Studio
        - Research
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Cel biznesowy i obserwowalny rezultat
      description: "Co będzie działać i dla kogo? Bez deklarowania niezweryfikowanego CEFR."
      placeholder: "Problem, rezultat, dowód ukończenia."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Zakres / poza zakresem
      placeholder: "IN: ...\nOUT: ..."
    validations:
      required: true
  - type: textarea
    id: context_docs
    attributes:
      label: Kontrakty / decyzje bazowe (opcjonalnie)
      description: "Linkuj obowiązujące ADR lub dokumenty z docs/. Nie kopiuj ich treści."
      placeholder: "https://github.com/clickbytes/flexLingua/blob/main/docs/adr/..."
    validations:
      required: false
  - type: textarea
    id: exit
    attributes:
      label: Kryteria odbioru całego epiku (DoD)
      description: "Pisz mierzalne checklisty: komenda CLI, artefakt, dowód albo jawna odmowa."
      placeholder: "- [ ] ..." 
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Zależności, ryzyka i zadania
      placeholder: "Depends on: #...\n- [ ] #..."
    validations:
      required: true
