name: "TASK — implementacja lub przegląd CLI"
description: "Jedno zadanie z wynikiem, kryteriami odbioru i weryfikacją."
title: "[TASK][P1][CORE] "
body:
  - type: markdown
    attributes:
      value: |
        Jedno issue opisuje jeden rezultat. Kryteria mają być sprawdzalne przez ręczny przegląd właściwego CLI.
        Powiąż issue z epikiem i blockerami, gdy mają zastosowanie. Aktualny status zapisuj tutaj.
  - type: input
    id: parent
    attributes:
      label: "Kod / link do epiku"
      placeholder: "STATE-02 / #123"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      options:
        - CORE / data / CLI
        - Platform / docs
        - GUI / Studio
        - Research
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Wynik i zakres
      placeholder: "Jaki obserwowalny rezultat ma dać to zadanie?"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Wskazówki implementacyjne (opcjonalnie)
      description: "Dodaj znane pliki lub symbole, jeśli pomagają rozpocząć pracę."
      placeholder: "js/core/grammar.js :: createRuleAdapter"
    validations:
      required: false
  - type: textarea
    id: context_docs
    attributes:
      label: Kontrakty / decyzje bazowe (opcjonalnie)
      description: "Linkuj obowiązujące ADR lub dokumenty z docs/. Nie kopiuj ich treści."
      placeholder: "https://github.com/clickbytes/flexLingua/blob/main/docs/adr/..."
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Kryteria odbioru
      placeholder: "- [ ] Oczekiwane zachowanie...\n- [ ] Przypadki odmowy..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Weryfikacja
      placeholder: "Komendy CLI, oczekiwane znaczenie i odmowy albo inne potrzebne kontrole."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Blokery / poza zakresem / ryzyka
      placeholder: "Blokowane przez: #...\nPoza zakresem: ..."
    validations:
      required: false

